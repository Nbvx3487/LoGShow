<!--
  index.html — the control window's page. The look is in styles.css and the
  behaviour in control.js, both in this folder.

  Layout, top to bottom:
    #top          Main area on the left (#stage), Outputs panel on the right (#outputs-panel).
    #bottom-wrap  Bottom panel with Lyrics / Scriptures tabs. The gear button
                  (#settings-button) hovers over the panel's top edge on the right.
                  Clicking the active tab collapses the panel.
    #settings-overlay  Full-screen settings, hidden until the gear is pressed.
    confirmDialog.js  Custom confirm and alert popups (replace the system ones).
-->
<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoGShow</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div id="app">

        <div id="top">
            <main id="stage">
                <h1>Welcome to LoGShow!</h1>
                <p id="version"></p>
            </main>

            <aside id="outputs-panel">
                <h2>Outputs</h2>
                <div class="group-buttons">
                    <button id="show-all">Show all</button>
                    <button id="end-all">End all</button>
                </div>
                <div id="output-list"></div>
            </aside>
        </div>

        <div id="bottom-wrap">
            <button id="settings-button" title="Settings">
                <img src="icons/gear.png" alt="Settings" class="gear-icon">
            </button>

            <section id="bottom-panel">
                <div id="bottom-tabs">
                    <button class="tab active" data-tab="lyrics">Lyrics</button>
                    <button class="tab" data-tab="scriptures">Scriptures</button>
                </div>
                <div id="bottom-content">
                    <div id="tab-lyrics" class="tab-content">Lyrics will appear here.</div>
                    <div id="tab-scriptures" class="tab-content" hidden>Scriptures will appear here.</div>
                </div>
            </section>
        </div>

    </div>

    <div id="settings-overlay" hidden>
        <header id="settings-header">
            <h2>Settings</h2>
            <button id="settings-close">Close</button>
        </header>
        <div id="settings-body">
            <div id="settings-content"></div>
            <nav id="settings-nav">
                <button class="section-button active" data-section="general">General</button>
                <button class="section-button" data-section="outputs">Outputs settings</button>
            </nav>
        </div>
    </div>

    <script src="confirmDialog.js"></script>
    <script src="control.js"></script>
</body>

</html>
